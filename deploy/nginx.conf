# NOT a standalone server block — webstocking.com's server block already
# exists (owned by Expose-Chain) at /etc/nginx/sites-available/webstocking.com.
# Paste this location block inside that existing `server { ... }`, before the
# Expose-Chain location block, then run: nginx -t && systemctl reload nginx

location = /medical-scanner {
    return 301 /medical-scanner/;
}

location /medical-scanner/ {
    alias /var/www/medical-scanner/dist/;
    index index.html;
    try_files $uri $uri/ /medical-scanner/index.html;
}
